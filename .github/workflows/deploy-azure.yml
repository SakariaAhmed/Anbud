name: Deploy Azure Container App

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RESOURCE_GROUP: anbud-prod
  CONTAINER_APP: anbud
  PROJECT_JOB_WORKER_APP: anbud-project-job-worker
  POSTGREST_APP: anbud-postgrest
  ACR_NAME: anbudprod9841703
  IMAGE_NAME: anbud
  MIN_REPLICAS: "0"
  PROJECT_JOB_WORKER_LIMIT: "1"
  PROJECT_JOB_WORKER_REPLICA_TIMEOUT: "2100"
  NODE_VERSION: "22.14.0"

jobs:
  deploy:
    name: Production deployment
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-azure
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::This commit does not have a successful Frontend CI run."
            exit 1
          fi
          echo "Using successful CI run $run_id for $GITHUB_SHA."

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Validate Azure deployment configuration
        env:
          DATA_API_URL: ${{ vars.DATA_API_URL }}
          DATA_API_SERVICE_ROLE_KEY: ${{ secrets.DATA_API_SERVICE_ROLE_KEY }}
          AZURE_STORAGE_ACCOUNT_URL: ${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'anbud-documents' }}
          APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
          MICROSOFT_ENTRA_CLIENT_ID: ${{ vars.MICROSOFT_ENTRA_CLIENT_ID }}
          MICROSOFT_ENTRA_CLIENT_SECRET: ${{ secrets.MICROSOFT_ENTRA_CLIENT_SECRET }}
          MICROSOFT_ENTRA_TENANT_SUBDOMAIN: ${{ vars.MICROSOFT_ENTRA_TENANT_SUBDOMAIN }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          APP_ADMIN_ACCESS_PASSWORD_HASH: ${{ secrets.APP_ADMIN_ACCESS_PASSWORD_HASH }}
          APP_ADMIN_PRINCIPAL_ID: ${{ vars.APP_ADMIN_PRINCIPAL_ID }}
          APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          APP_GUEST_CODE_PEPPER: ${{ secrets.APP_GUEST_CODE_PEPPER }}
          APP_IDENTITY_LOOKUP_SECRET: ${{ secrets.APP_IDENTITY_LOOKUP_SECRET }}
          APP_ACTIVITY_HASH_SECRET: ${{ secrets.APP_ACTIVITY_HASH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROJECT_JOB_WORKER_TOKEN: ${{ secrets.PROJECT_JOB_WORKER_TOKEN }}
        run: |
          missing=0
          for name in DATA_API_URL DATA_API_SERVICE_ROLE_KEY AZURE_STORAGE_ACCOUNT_URL AZURE_STORAGE_CONTAINER APP_PUBLIC_ORIGIN MICROSOFT_ENTRA_CLIENT_ID MICROSOFT_ENTRA_CLIENT_SECRET MICROSOFT_ENTRA_TENANT_SUBDOMAIN APP_ENCRYPTION_KEY APP_ADMIN_ACCESS_PASSWORD_HASH APP_ADMIN_PRINCIPAL_ID APP_SESSION_SECRET APP_GUEST_CODE_PEPPER APP_IDENTITY_LOOKUP_SECRET APP_ACTIVITY_HASH_SECRET OPENAI_API_KEY PROJECT_JOB_WORKER_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub production configuration: $name"
              missing=1
            fi
          done
          if [ "${#DATA_API_SERVICE_ROLE_KEY}" -lt 32 ]; then
            echo "::error::DATA_API_SERVICE_ROLE_KEY is invalid."
            missing=1
          fi
          if [[ ! "$AZURE_STORAGE_ACCOUNT_URL" =~ ^https://[a-z0-9-]+\.blob\.core\.windows\.net$ ]]; then
            echo "::error::AZURE_STORAGE_ACCOUNT_URL must identify Azure Blob Storage."
            missing=1
          fi
          if [[ ! "$AZURE_STORAGE_CONTAINER" =~ ^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$ ]]; then
            echo "::error::AZURE_STORAGE_CONTAINER is invalid."
            missing=1
          fi
          postgrest_fqdn="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$POSTGREST_APP" --query properties.configuration.ingress.fqdn --output tsv --only-show-errors 2>/dev/null || true)"
          postgrest_external="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$POSTGREST_APP" --query properties.configuration.ingress.external --output tsv --only-show-errors 2>/dev/null || true)"
          if [ "${DATA_API_URL%/}" != "https://${postgrest_fqdn}" ] || [ "$postgrest_external" != "false" ]; then
            echo "::error::DATA_API_URL must identify the live internal-only PostgREST app."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate production database contract
        env:
          DATA_API_URL: ${{ vars.DATA_API_URL }}
          DATA_API_SERVICE_ROLE_KEY: ${{ secrets.DATA_API_SERVICE_ROLE_KEY }}
        run: node scripts/validate_project_jobs_schema.mjs --remote

      - name: Capture last healthy images
        run: |
          current_app_image="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query "properties.template.containers[?name=='web'].image | [0]" --output tsv)"
          current_worker_image="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$PROJECT_JOB_WORKER_APP" --query "properties.template.containers[?name=='worker'].image | [0]" --output tsv)"
          if [ -z "$current_app_image" ] || [ -z "$current_worker_image" ]; then
            echo "::error::Could not resolve the current healthy application images."
            exit 1
          fi
          echo "CURRENT_APP_IMAGE=$current_app_image" >> "$GITHUB_ENV"
          echo "CURRENT_WORKER_IMAGE=$current_worker_image" >> "$GITHUB_ENV"

      - name: Docker login to ACR with Azure identity
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build and push candidate image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: apps/frontend/Dockerfile
          target: runner-docling
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Resolve immutable candidate image
        id: immutable_image
        env:
          BUILT_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          if [[ ! "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image build did not return a valid immutable digest."
            exit 1
          fi
          tag_digest="$(az acr repository show --name "$ACR_NAME" --image "$IMAGE_NAME:$GITHUB_SHA" --query digest -o tsv)"
          if [ "$tag_digest" != "$BUILT_DIGEST" ]; then
            echo "::error::The pushed SHA tag no longer identifies the image produced by this build."
            exit 1
          fi
          candidate_image="$ACR_NAME.azurecr.io/$IMAGE_NAME@$BUILT_DIGEST"
          echo "CANDIDATE_IMAGE=$candidate_image" >> "$GITHUB_ENV"
          echo "candidate_image=$candidate_image" >> "$GITHUB_OUTPUT"

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.immutable_image.outputs.candidate_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Reconcile Azure infrastructure without releasing candidate code
        env:
          DATA_API_URL: ${{ vars.DATA_API_URL }}
          DATA_API_SERVICE_ROLE_KEY: ${{ secrets.DATA_API_SERVICE_ROLE_KEY }}
          AZURE_STORAGE_ACCOUNT_URL: ${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'anbud-documents' }}
          APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
          MICROSOFT_ENTRA_CLIENT_ID: ${{ vars.MICROSOFT_ENTRA_CLIENT_ID }}
          MICROSOFT_ENTRA_CLIENT_SECRET: ${{ secrets.MICROSOFT_ENTRA_CLIENT_SECRET }}
          MICROSOFT_ENTRA_TENANT_SUBDOMAIN: ${{ vars.MICROSOFT_ENTRA_TENANT_SUBDOMAIN }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          APP_ADMIN_ACCESS_PASSWORD_HASH: ${{ secrets.APP_ADMIN_ACCESS_PASSWORD_HASH }}
          LEGACY_APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          LEGACY_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          LEGACY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          APP_GUEST_CODE_PEPPER: ${{ secrets.APP_GUEST_CODE_PEPPER }}
          APP_IDENTITY_LOOKUP_SECRET: ${{ secrets.APP_IDENTITY_LOOKUP_SECRET }}
          APP_ACTIVITY_HASH_SECRET: ${{ secrets.APP_ACTIVITY_HASH_SECRET }}
          APP_ADMIN_PRINCIPAL_ID: ${{ vars.APP_ADMIN_PRINCIPAL_ID }}
          APP_ADMIN_DISPLAY_NAME: ${{ vars.APP_ADMIN_DISPLAY_NAME || 'Administrator' }}
          APP_ADMIN_EMAILS: ${{ vars.APP_ADMIN_EMAILS }}
          AZURE_COMMUNICATION_EMAIL_ENDPOINT: ${{ vars.AZURE_COMMUNICATION_EMAIL_ENDPOINT }}
          AZURE_COMMUNICATION_EMAIL_SENDER: ${{ vars.AZURE_COMMUNICATION_EMAIL_SENDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4' }}
          OPENAI_DOCUMENT_ANALYSIS_MODEL: ${{ vars.OPENAI_DOCUMENT_ANALYSIS_MODEL || 'gpt-5.6-terra' }}
          DOCUMENT_ANALYSIS_VERSION: ${{ vars.DOCUMENT_ANALYSIS_VERSION || 'off' }}
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ vars.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
          AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
          AZURE_DOCUMENT_INTELLIGENCE_HIGH_RESOLUTION: ${{ vars.AZURE_DOCUMENT_INTELLIGENCE_HIGH_RESOLUTION || 'auto' }}
          PROJECT_JOB_WORKER_TOKEN: ${{ secrets.PROJECT_JOB_WORKER_TOKEN }}
          PROJECT_JOB_WORKER_CRON: ${{ vars.PROJECT_JOB_WORKER_CRON || '*/5 * * * *' }}
          DOCLING_ENHANCEMENT_MODE: ${{ vars.DOCLING_ENHANCEMENT_MODE || 'async' }}
          DOCLING_ASYNC_AUTO_RUN: ${{ vars.DOCLING_ASYNC_AUTO_RUN || 'off' }}
        run: |
          legacy_revision="$(az containerapp revision list --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query "[?properties.active && length(properties.template.containers[0].env[?secretRef=='app-access-password']) > \`0\`].name | [0]" --output tsv --only-show-errors)"
          if [ -n "$legacy_revision" ] && [ -z "$LEGACY_APP_ACCESS_PASSWORD" ]; then
            echo "::error::An active legacy revision still requires app-access-password."
            exit 1
          fi
          legacy_supabase_revision="$(az containerapp revision list --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query "[?properties.active && (length(properties.template.containers[0].env[?secretRef=='supabase-url']) > \`0\` || length(properties.template.containers[0].env[?secretRef=='supabase-service-role-key']) > \`0\`)].name | [0]" --output tsv --only-show-errors)"
          if [ -n "$legacy_supabase_revision" ] && { [ -z "$LEGACY_SUPABASE_URL" ] || [ -z "$LEGACY_SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "::error::The active rollback revision still requires the temporary Supabase secrets."
            exit 1
          fi
          parameters=(
            appName="$CONTAINER_APP"
            image="$CURRENT_APP_IMAGE"
            workerImage="$CURRENT_WORKER_IMAGE"
            registryName="$ACR_NAME"
            dataApiUrl="$DATA_API_URL"
            dataApiServiceRoleKey="$DATA_API_SERVICE_ROLE_KEY"
            azureStorageAccountUrl="$AZURE_STORAGE_ACCOUNT_URL"
            azureStorageContainer="$AZURE_STORAGE_CONTAINER"
            appPublicOrigin="$APP_PUBLIC_ORIGIN"
            microsoftEntraClientId="$MICROSOFT_ENTRA_CLIENT_ID"
            microsoftEntraClientSecret="$MICROSOFT_ENTRA_CLIENT_SECRET"
            microsoftEntraTenantSubdomain="$MICROSOFT_ENTRA_TENANT_SUBDOMAIN"
            appEncryptionKey="$APP_ENCRYPTION_KEY"
            appAdminAccessPasswordHash="$APP_ADMIN_ACCESS_PASSWORD_HASH"
            legacyAppAccessPassword="$LEGACY_APP_ACCESS_PASSWORD"
            legacySupabaseUrl="$LEGACY_SUPABASE_URL"
            legacySupabaseServiceRoleKey="$LEGACY_SUPABASE_SERVICE_ROLE_KEY"
            appSessionSecret="$APP_SESSION_SECRET"
            appGuestCodePepper="$APP_GUEST_CODE_PEPPER"
            appIdentityLookupSecret="$APP_IDENTITY_LOOKUP_SECRET"
            appActivityHashSecret="$APP_ACTIVITY_HASH_SECRET"
            adminPrincipalId="$APP_ADMIN_PRINCIPAL_ID"
            adminDisplayName="$APP_ADMIN_DISPLAY_NAME"
            appAdminEmails="$APP_ADMIN_EMAILS"
            azureCommunicationEmailEndpoint="$AZURE_COMMUNICATION_EMAIL_ENDPOINT"
            azureCommunicationEmailSender="$AZURE_COMMUNICATION_EMAIL_SENDER"
            openAiApiKey="$OPENAI_API_KEY"
            openAiModel="$OPENAI_MODEL"
            openAiDocumentAnalysisModel="$OPENAI_DOCUMENT_ANALYSIS_MODEL"
            documentAnalysisVersion="$DOCUMENT_ANALYSIS_VERSION"
            azureDocumentIntelligenceEndpoint="$AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT"
            azureDocumentIntelligenceKey="$AZURE_DOCUMENT_INTELLIGENCE_KEY"
            azureDocumentIntelligenceHighResolution="$AZURE_DOCUMENT_INTELLIGENCE_HIGH_RESOLUTION"
            projectJobWorkerToken="$PROJECT_JOB_WORKER_TOKEN"
            projectJobWorkerCron="$PROJECT_JOB_WORKER_CRON"
            projectJobWorkerLimit="$PROJECT_JOB_WORKER_LIMIT"
            projectJobWorkerReplicaTimeout="$PROJECT_JOB_WORKER_REPLICA_TIMEOUT"
            doclingEnhancementMode="$DOCLING_ENHANCEMENT_MODE"
            doclingAsyncAutoRun="$DOCLING_ASYNC_AUTO_RUN"
            externalIngressEnabled=true
            minReplicas="$MIN_REPLICAS"
          )
          az deployment group what-if --resource-group "$RESOURCE_GROUP" --template-file infra/azure/container-app.bicep --result-format ResourceIdOnly --parameters "${parameters[@]}"
          az deployment group create --resource-group "$RESOURCE_GROUP" --name "anbud-infra-${GITHUB_SHA}" --template-file infra/azure/container-app.bicep --parameters "${parameters[@]}" --output none

      - name: Roll out zero-traffic candidate and promote
        id: rollout
        env:
          CANDIDATE_IMAGE: ${{ steps.immutable_image.outputs.candidate_image }}
          REVISION_SUFFIX: sha-${{ github.sha }}
          ROLLOUT_STATE_FILE: ${{ runner.temp }}/anbud-rollout-state.json
          DATA_API_URL: ${{ vars.DATA_API_URL }}
          DATA_API_SERVICE_ROLE_KEY: ${{ secrets.DATA_API_SERVICE_ROLE_KEY }}
        run: node scripts/azure_containerapp_rollout.mjs

      - name: Remove retired Supabase secrets
        run: |
          active_legacy_refs="$(az containerapp revision list --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query "[?properties.active && (length(properties.template.containers[0].env[?secretRef=='supabase-url']) > \`0\` || length(properties.template.containers[0].env[?secretRef=='supabase-service-role-key']) > \`0\`)].name | [0]" --output tsv --only-show-errors)"
          if [ -n "$active_legacy_refs" ]; then
            echo "::error::An active revision still references a retired Supabase secret."
            exit 1
          fi
          configured_legacy_secrets="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query "properties.configuration.secrets[?name=='supabase-url' || name=='supabase-service-role-key'].name" --output tsv --only-show-errors)"
          if [ -n "$configured_legacy_secrets" ]; then
            az containerapp secret remove --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --secret-names supabase-url supabase-service-role-key --output none --only-show-errors
          fi
          remaining_legacy_secrets="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query "properties.configuration.secrets[?name=='supabase-url' || name=='supabase-service-role-key'].name | [0]" --output tsv --only-show-errors)"
          if [ -n "$remaining_legacy_secrets" ]; then
            echo "::error::Retired Supabase secrets remain configured."
            exit 1
          fi

      - name: Roll back to the previous Azure revision
        if: >-
          ${{ always()
              && (steps.rollout.outcome == 'failure'
                  || steps.rollout.outcome == 'cancelled') }}
        env:
          DATA_API_URL: ${{ vars.DATA_API_URL }}
          DATA_API_SERVICE_ROLE_KEY: ${{ secrets.DATA_API_SERVICE_ROLE_KEY }}
        run: |
          state_file="${RUNNER_TEMP}/anbud-rollout-state.json"
          if [ -f "$state_file" ]; then
            node scripts/azure_containerapp_rollout.mjs --rollback-state "$state_file"
          fi
