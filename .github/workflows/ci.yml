name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.14.0"

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.132@sha256:e09e93a61ed1560caf4be79c9eb29401875bea74b12aec4657cb08bf34ea3a13
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRIMARY_DOCUMENT_SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PROJECT_JOB_LOCK_SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DOCUMENT_CHUNKS_SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SERVICE_DOCUMENT_SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security, tests, and build
        run: |
          npm run secrets:scan
          npm test
          npm run lint
          npm run build

      - name: Repository contracts
        working-directory: .
        run: |
          node --test \
            apps/frontend/scripts/run_azure_migration_control.test.mjs \
            scripts/azure_cutover_evidence.test.mjs \
            scripts/azure_database_compare.test.mjs \
            scripts/azure_pg_restore_toc_sanitize.test.mjs \
            scripts/validate_project_jobs_schema.test.mjs \
            scripts/azure_containerapp_rollout.test.mjs \
            scripts/async_worker_boundaries.test.mjs \
            scripts/azure_migration_guardrails.test.mjs
          node scripts/validate_project_jobs_schema.mjs
          node scripts/verify_workflow_boundaries.mjs
          node scripts/validate_release_workflows.mjs

      - name: Parse workflow YAML
        working-directory: .
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.parse_file(file) }'

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate Bicep
        run: |
          for template in infra/azure/*.bicep
          do
            az bicep build --file "$template" --stdout > /dev/null
            az bicep lint --file "$template"
          done
