name: Azure migration control validation

on:
  pull_request:
    paths:
      - .github/workflows/azure-migration-control-validation.yml
      - .github/workflows/deploy-azure.yml
      - apps/frontend/Dockerfile
      - apps/frontend/package-lock.json
      - apps/frontend/package.json
      - apps/frontend/scripts/azure_blob_migrate_verify.mjs
      - apps/frontend/scripts/azure_blob_migrate_verify.test.mjs
      - apps/frontend/scripts/run_azure_migration_control.mjs
      - apps/frontend/scripts/run_azure_migration_control.test.mjs
      - infra/azure/migration-control.bicep
      - scripts/azure_cutover_evidence.mjs
      - scripts/azure_cutover_evidence.test.mjs
      - scripts/azure_cutover_evidence_test_fixtures.mjs
      - scripts/azure_database_compare.mjs
      - scripts/azure_database_compare.test.mjs
      - scripts/azure_pg_restore_toc_sanitize.mjs
      - scripts/azure_pg_restore_toc_sanitize.test.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/azure-migration-control-validation.yml
      - .github/workflows/deploy-azure.yml
      - apps/frontend/Dockerfile
      - apps/frontend/package-lock.json
      - apps/frontend/package.json
      - apps/frontend/scripts/azure_blob_migrate_verify.mjs
      - apps/frontend/scripts/azure_blob_migrate_verify.test.mjs
      - apps/frontend/scripts/run_azure_migration_control.mjs
      - apps/frontend/scripts/run_azure_migration_control.test.mjs
      - infra/azure/migration-control.bicep
      - scripts/azure_cutover_evidence.mjs
      - scripts/azure_cutover_evidence.test.mjs
      - scripts/azure_cutover_evidence_test_fixtures.mjs
      - scripts/azure_database_compare.mjs
      - scripts/azure_database_compare.test.mjs
      - scripts/azure_pg_restore_toc_sanitize.mjs
      - scripts/azure_pg_restore_toc_sanitize.test.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.14.0"

jobs:
  validation:
    name: Internal control contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Validate migration data and control boundaries
        run: |
          node --test \
            apps/frontend/scripts/azure_blob_migrate_verify.test.mjs \
            apps/frontend/scripts/run_azure_migration_control.test.mjs \
            scripts/azure_cutover_evidence.test.mjs \
            scripts/azure_database_compare.test.mjs \
            scripts/azure_pg_restore_toc_sanitize.test.mjs

      - name: Build and lint control infrastructure
        run: |
          az bicep build --file infra/azure/migration-control.bicep --stdout > /dev/null
          az bicep lint --file infra/azure/migration-control.bicep

      - name: Parse workflows
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/azure-migration-control-validation.yml"); YAML.parse_file(".github/workflows/deploy-azure.yml")'
